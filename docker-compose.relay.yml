services:
  divar-relay:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      DIVAR_RELAY_TOKEN: ${DIVAR_RELAY_TOKEN:?Set DIVAR_RELAY_TOKEN in .env}
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
